[project]
name = "controlnet-mcp"
version = "0.1.0"
description = "Local MCP server exposing ControlNet-style geometric image analyses for 3D reconstruction agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "controlnet-aux>=0.0.10",
    "huggingface-hub>=1.32.0",
    "mcp[cli]>=2.2.0",
    "numpy>=2.5.3",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=12.3.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
]

[project.scripts]
controlnet-mcp = "controlnet_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/controlnet_mcp"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", group = "cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", group = "cpu", marker = "sys_platform == 'linux'" }]

[tool.uv]
default-groups = ["dev", "cpu"]
conflicts = [[{ group = "cpu" }, { group = "cuda" }]]

[dependency-groups]
dev = [
    "anyio>=4.15.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]
cpu = [
    "torch>=2.14.0",
    "torchvision>=0.29.0",
]
cuda = [
    "torch>=2.14.0",
    "torchvision>=0.29.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: takes more than a second (real model inference)",
    "integration: requires real checkpoints on disk",
]
filterwarnings = [
    "ignore:Overwriting tiny_vit_.* in registry:UserWarning",
    "ignore:Importing from timm.models.*is deprecated:FutureWarning",
    "ignore::DeprecationWarning:controlnet_aux",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["controlnet_mcp", "conftest"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
